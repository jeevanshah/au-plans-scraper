name: Scrape AU NBN & mobile plans

on:
  workflow_dispatch: {}
  # Daily at 12:00am AEST (UTC+10, Australian Eastern Standard Time -- no
  # daylight saving in July). GitHub Actions cron is UTC-only and not
  # DST-aware, so during AEDT (UTC+11, roughly early Oct-early Apr) this
  # will run at 1:00am local time instead of 12:00am -- a 1-hour drift for
  # about 5 months of the year. Acceptable for a daily data-freshness job;
  # revisit with a season-aware second cron entry if exact midnight ever
  # matters more precisely.
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium chrome

      - name: Run parser tests
        run: python -m pytest tests/

      - name: Run scrapers
        run: python run.py
        continue-on-error: true

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name "au-plans-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deals.json data/meta.json data/changelog.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update scraped plan data [skip ci]"
            # main can move between checkout and this push (e.g. a manual
            # commit lands mid-run) -- rebase onto the latest main and retry
            # once rather than failing the whole run on a non-fast-forward push.
            for attempt in 1 2; do
              if git push; then
                break
              fi
              echo "push rejected, rebasing onto latest main and retrying (attempt $attempt)"
              git fetch origin main
              git rebase origin/main
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deals page pre-render
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.DEALS_SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jeevanshah/jrsdigital-site/dispatches \
            -d '{"event_type":"deals-data-updated"}'

      - name: Manage staleness issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/manage_stale_issues.py
