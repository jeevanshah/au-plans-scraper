name: Scrape AU NBN & mobile plans

on:
  workflow_dispatch: {}
  # Manual trigger only for now. Once the pilot providers have been proven
  # stable over a few manual runs, uncomment the schedule below (daily,
  # 2:17am UTC ~ low-traffic time, off the hour to avoid GitHub Actions'
  # top-of-hour cron congestion).
  # schedule:
  #   - cron: '17 2 * * *'

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run parser tests
        run: pytest tests/
        continue-on-error: true

      - name: Run scrapers
        run: python run.py
        continue-on-error: true

      - name: Commit data if changed
        run: |
          git config user.name "au-plans-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deals.json data/meta.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update scraped plan data [skip ci]"
            git push
          fi

      - name: Manage staleness issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/manage_stale_issues.py
