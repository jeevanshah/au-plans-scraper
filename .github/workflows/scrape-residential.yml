name: Scrape blocked providers (residential runner)

# Dodo, Vodafone, Neptune, Mint, More and Leaptel block GitHub's datacenter
# IPs but work from an Australian home connection (see NOTES.md, "cloud-IP
# blocking"). This job scrapes only the providers in residential_providers.txt
# on a self-hosted runner installed on a home PC. If the PC is off at the
# scheduled time, GitHub queues the job until the runner comes online.
#
# Runner setup: repo Settings -> Actions -> Runners -> New self-hosted runner
# (Windows), install it as a service, and have Python 3.12 + Git on PATH.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 14 * * *'   # 30 min after scrape.yml

permissions:
  contents: write

concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape-residential:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade -r requirements.txt
          python -m playwright install chromium

      - name: Scrape blocked providers
        run: python run.py --only-file residential_providers.txt
        continue-on-error: true

      - name: Commit data if changed
        id: commit
        run: |
          git config user.name "au-plans-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deals.json data/meta.json data/changelog.json data/bundles.json data/price_history.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            "No data changes to commit"
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          git commit -m "chore: update residential-scraped plan data [skip ci]"
          foreach ($attempt in 1..2) {
            git push
            if ($LASTEXITCODE -eq 0) { break }
            "push rejected, rebasing onto latest main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          }
          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Trigger deals page pre-render
        if: steps.commit.outputs.changed == 'true'
        run: |
          $headers = @{
            Authorization = "Bearer ${{ secrets.DEALS_SITE_DISPATCH_TOKEN }}"
            Accept = "application/vnd.github+json"
          }
          Invoke-RestMethod -Method Post -Headers $headers `
            -Uri "https://api.github.com/repos/jeevanshah/jrsdigital-site/dispatches" `
            -Body '{"event_type":"deals-data-updated"}'
